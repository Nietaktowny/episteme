[project]
name = "episteme"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nietaktowny", email = "wojciech.lukasz.mytych@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "apscheduler>=3.11.3",
    "dotenv>=0.9.9",
    "duckdb>=2.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.29.1",
]

[project.scripts]
episteme = "episteme.__main__:main"

[project.optional-dependencies]
tui = [
    "textual>=8.2.8",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.30.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
