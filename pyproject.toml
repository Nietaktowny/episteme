[project]
name = "episteme"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nietaktowny", email = "wojciech.lukasz.mytych@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "dotenv>=0.9.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[project.scripts]
episteme = "episteme.__main__:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
